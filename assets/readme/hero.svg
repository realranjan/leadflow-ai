<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">LeadFlow AI — Autonomous Lead Intelligence &amp; Outreach</title>
  <desc id="desc">Multi-agent sales pipeline and scoring engine created by Ranjan Vernekar.</desc>

  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0D1322"/>
      <stop offset="100%" stop-color="#0A0E18"/>
    </linearGradient>

    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.2"/>
    </linearGradient>

    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="24" fill="url(#bg-grad)"/>
  <rect width="1200" height="380" rx="24" fill="url(#dot-grid)"/>
  <rect width="1200" height="380" rx="24" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Left Column: Typography and Value Proposition -->
  <g id="hero-left" transform="translate(56, 44)">
    <!-- Eyebrow Tag -->
    <rect x="0" y="0" width="280" height="30" rx="15" fill="url(#badge-grad)" stroke="#6366F1" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="16" cy="15" r="4.5" fill="#10B981"/>
    <text x="30" y="20" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1.2">AUTONOMOUS MULTI-AGENT PIPELINE</text>

    <!-- Main Title -->
    <text x="0" y="86" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.2">LeadFlow AI</text>

    <!-- Subtitle / Hook -->
    <text x="0" y="126" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400">Autonomous lead intelligence, multi-agent qualification,</text>
    <text x="0" y="152" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400">and hyper-personalized email outreach at enterprise scale.</text>

    <!-- Tech Stack Chips -->
    <g transform="translate(0, 184)">
      <!-- Chip 1: LangGraph -->
      <rect x="0" y="0" width="100" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="50" y="17" fill="#CBD5E1" font-family="ui-monospace, monospace" font-size="12" font-weight="600" text-anchor="middle">LangGraph</text>

      <!-- Chip 2: FastAPI -->
      <rect x="108" y="0" width="80" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="148" y="17" fill="#CBD5E1" font-family="ui-monospace, monospace" font-size="12" font-weight="600" text-anchor="middle">FastAPI</text>

      <!-- Chip 3: React 19 -->
      <rect x="196" y="0" width="88" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="240" y="17" fill="#CBD5E1" font-family="ui-monospace, monospace" font-size="12" font-weight="600" text-anchor="middle">React 19</text>

      <!-- Chip 4: Supabase -->
      <rect x="292" y="0" width="94" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="339" y="17" fill="#CBD5E1" font-family="ui-monospace, monospace" font-size="12" font-weight="600" text-anchor="middle">Supabase</text>

      <!-- Chip 5: Gemini -->
      <rect x="394" y="0" width="84" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="436" y="17" fill="#CBD5E1" font-family="ui-monospace, monospace" font-size="12" font-weight="600" text-anchor="middle">Gemini</text>
    </g>

    <!-- Author Badge -->
    <g transform="translate(0, 240)">
      <rect x="0" y="0" width="370" height="38" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <!-- User Avatar / Icon -->
      <rect x="6" y="6" width="26" height="26" rx="6" fill="#6366F1"/>
      <text x="19" y="23" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" text-anchor="middle">RV</text>
      <!-- Text -->
      <text x="42" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500">
        Created by <tspan font-weight="700" fill="#38BDF8">Ranjan Vernekar</tspan> (@realranjan)
      </text>
    </g>
  </g>

  <!-- Right Column: Live Pipeline Orchestration Graphic -->
  <g id="hero-right" transform="translate(630, 36)">
    <!-- Container Card -->
    <rect width="514" height="308" rx="16" fill="#0C1220" stroke="url(#card-border)" stroke-width="1.5"/>

    <!-- Window Title Bar -->
    <rect width="514" height="38" rx="16" fill="#131C2E"/>
    <rect y="36" width="514" height="2" fill="#1E293B"/>
    <circle cx="20" cy="19" r="5" fill="#EF4444" fill-opacity="0.8"/>
    <circle cx="36" cy="19" r="5" fill="#F59E0B" fill-opacity="0.8"/>
    <circle cx="52" cy="19" r="5" fill="#10B981" fill-opacity="0.8"/>
    <text x="76" y="24" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="12" font-weight="600">pipeline.run(lead_id="ld_984f") · 27.4s</text>
    <rect x="420" y="10" width="80" height="18" rx="4" fill="#10B981" fill-opacity="0.15"/>
    <text x="460" y="23" fill="#34D399" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">ONLINE</text>

    <!-- Node 1: Ingested Lead -->
    <g transform="translate(20, 52)">
      <rect width="474" height="42" rx="8" fill="#162032" stroke="#25334D" stroke-width="1"/>
      <circle cx="22" cy="21" r="8" fill="#6366F1" fill-opacity="0.2"/>
      <text x="22" y="25" fill="#818CF8" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">👤</text>
      <text x="40" y="20" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Sophia Turner</text>
      <text x="135" y="20" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">· VP Growth at FinScale Inc</text>
      <text x="40" y="34" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="10">Target ICP: B2B Fintech SaaS (50-250 employees)</text>
    </g>

    <!-- Node 2: Parallel Research Agents -->
    <g transform="translate(20, 102)">
      <!-- Company Node -->
      <rect x="0" y="0" width="230" height="54" rx="8" fill="#162032" stroke="#25334D" stroke-width="1"/>
      <text x="12" y="20" fill="#A5B4FC" font-family="ui-monospace, monospace" font-size="11" font-weight="700">🏢 COMPANY AGENT</text>
      <text x="12" y="35" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Series B ($28M) · 140 staff</text>
      <text x="12" y="47" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">✓ High market fit (96%)</text>

      <!-- Personal Node -->
      <rect x="244" y="0" width="230" height="54" rx="8" fill="#162032" stroke="#25334D" stroke-width="1"/>
      <text x="256" y="20" fill="#67E8F9" font-family="ui-monospace, monospace" font-size="11" font-weight="700">🔎 PROSPECT AGENT</text>
      <text x="256" y="35" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Active poster · Scaling rev</text>
      <text x="256" y="47" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">✓ Seniority verified (VP)</text>
    </g>

    <!-- Node 3: 7-Judge Consensus Score -->
    <g transform="translate(20, 164)">
      <rect width="474" height="56" rx="8" fill="#162032" stroke="#374151" stroke-width="1"/>
      <!-- Score Circle Badge -->
      <rect x="12" y="8" width="40" height="40" rx="8" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1.5"/>
      <text x="32" y="33" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800" text-anchor="middle">94</text>

      <text x="64" y="24" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">7-Judge Consensus: Tier A Lead</text>
      <text x="64" y="42" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Role: 15/15 · Fit: 30/30 · Use Case: 19/20 · Presence: 10/10</text>

      <rect x="382" y="16" width="80" height="24" rx="4" fill="#6366F1" fill-opacity="0.25"/>
      <text x="422" y="32" fill="#A5B4FC" font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="middle">SCORE &gt; 70</text>
    </g>

    <!-- Node 4: Synthesis & Outreach -->
    <g transform="translate(20, 228)">
      <rect width="474" height="66" rx="8" fill="#162032" stroke="#4F46E5" stroke-opacity="0.4" stroke-width="1"/>
      <text x="14" y="22" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="11" font-weight="700">✍️ OUTREACH GENERATED &amp; READY TO DISPATCH</text>
      <text x="14" y="40" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">"Hi Sophia, noticed FinScale's expansion into cross-border workflows..."</text>
      <text x="14" y="56" fill="#64748B" font-family="ui-monospace, monospace" font-size="10">Model: Gemini 3.6 Flash · 98.3% Confidence · Ready for SMTP send</text>
    </g>
  </g>
</svg>